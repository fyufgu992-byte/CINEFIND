<style>
:root{--bg:#080808;--ch:#151515;--red:#FF2638;--pur:#8B5CF6;--blu:#38BDF8;--tx:#f6f6f8;--mu:#9b9ba6;--bd:rgba(255,255,255,.09);--glass:rgba(18,18,20,.74);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:720px;margin:0 auto;padding-top:env(safe-area-inset-top,0);min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.ico{display:inline-flex;vertical-align:middle}
.view{display:none;padding:0 16px 110px}
.view.on{display:block}
@media (prefers-reduced-motion:no-preference){.view.on{animation:in .32s ease-out}@keyframes in{from{opacity:0;transform:translateY(10px)}}}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.02em}
.logo b{color:var(--red)}
.logo-top{justify-content:flex-start;gap:14px;padding:10px 0 4px}
.brandimg{width:88px;height:88px;flex:none;border-radius:50%;display:block}
.brandtxt{font-size:clamp(32px,10vw,46px);font-weight:800;letter-spacing:.02em;line-height:1}
.brandtxt b{color:#FFC21A}
.brand{font-size:40px;gap:12px;letter-spacing:.03em;line-height:1}
.brand .ico svg{width:54px;height:54px}
.fake{display:flex;align-items:center;gap:10px;width:100%;padding:15px 16px;border-radius:16px;background:var(--ch);border:1px solid var(--bd);color:var(--mu);font-size:15px}
.hero{position:relative;margin-top:16px;border-radius:22px;overflow:hidden;min-height:400px;display:flex;align-items:flex-end;box-shadow:0 20px 50px -20px #FF263866}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#080808 8%,#080808b8 38%,transparent 75%),linear-gradient(120deg,#8B5CF633,transparent 50%)}
.hero-in{position:relative;z-index:1;padding:20px;width:100%}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:8px 0}
.hero p{font-size:14px;line-height:1.5;color:#d8d8de;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:#cfcfd6}
.pill{background:var(--red);color:#fff;font-weight:600;padding:3px 10px;border-radius:999px;font-size:12px}
.acts{display:flex;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1;padding:13px 14px;border-radius:14px;font-weight:600;font-size:14px;background:var(--red);color:#fff;box-shadow:0 8px 22px -10px var(--red);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.alt{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid var(--bd);backdrop-filter:blur(10px)}
.btn.on{color:var(--red);border-color:#FF263888}
.sec{margin-top:26px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sh h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sh h2::before{content:"";display:inline-block;width:4px;height:16px;background:var(--red);border-radius:2px;margin-right:9px;vertical-align:-2px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{flex:none;width:128px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:14px 12px}
.poster{display:block;width:100%;transition:transform .15s}
.poster:active{transform:scale(.96)}
@media (hover:hover){.poster:hover{transform:translateY(-4px)}.poster:hover .pic{box-shadow:0 12px 28px -8px #FF263877}}
.pic{position:relative;border-radius:14px;overflow:hidden;background:var(--ch);aspect-ratio:2/3;box-shadow:0 8px 20px #0008;transition:box-shadow .2s}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.nop{display:grid;place-items:center;height:100%;padding:10px;text-align:center;font-size:13px;color:var(--mu)}
.badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--glass);backdrop-filter:blur(8px);color:#ffd166;border:1px solid var(--bd)}
.rm{position:absolute;top:6px;right:6px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--glass);backdrop-filter:blur(8px)}
.t{display:block;margin-top:8px;font-size:13px;font-weight:600;line-height:1.25}
.y{display:block;font-size:12px;color:var(--mu);margin-top:2px}

          tr && h("button", { class: "btn", onclick: () => playTrailer(tr.key) }, ico("play", 18), "Watch Trailer"),
          tbtn("favorites", m, "Favorited", "Add to Favorites", "heart"),
          h("button", { class: "btn alt", onclick: () => { provBox.hidden = !provBox.hidden; } }, ico("tv", 18), "Where to Watch"),
          tbtn("watchlist", m, "In Watchlist", "Add to Watchlist", "plus"),
          tbtn("watched", m, "Watched", "Mark as Watched", "eye")),
        provBox,
        m.tagline && h("p", { class: "tagline" }, "“" + m.tagline + "”"),
        sec("Story", h("p", { class: "syn" }, m.overview || "No synopsis available.")),
        dir && h("p", { class: "y", style: "margin-top:12px;font-size:14px" }, "Directed by ", h("b", { style: "color:var(--tx)" }, dir)),
        cast.length ? sec("Cast", h("div", { class: "rail cast" }, cast.map(a => h("button", { onclick: () => hooks.searchActor({ id: a.id, name: a.name }), "aria-label": "Movies with " + a.name }, h("img", { class: "av", src: IMG + "w185" + a.profile_path, alt: "", loading: "lazy" }), h("div", { class: "cn" }, a.name), h("div", { class: "cc" }, a.character))))) : null,
        sim.length ? sec("Similar Movies", rail(sim)) : null));
    box.scrollTop = 0;
  } catch { box.replaceChildren(h("button", { class: "close", "aria-label": "Back", onclick: closeDetail }, ico("back")), h("div", { style: "padding-top:90px" }, errState(() => openDetail(id)))); }
}

initHome(); initSearch(); initDisc(); initList(); initMe();
go("home");
</script>
</body>
